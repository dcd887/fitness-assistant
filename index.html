<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健身助手 · 按目标与条件排计划</title>
<style>
  :root{
    --ink:#1d1c1a; --ink2:#4d4842; --faint:#8b8478; --line:#dcd5c7;
    --paper:#f6f3ec; --card:#fffdf8; --accent:#a63a2a; --accent2:#1f6b4a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       -webkit-text-size-adjust:100%}
  .wrap{max-width:860px;margin:0 auto;padding:26px 18px 60px}
  header{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
  h1{margin:0;font-size:24px;letter-spacing:.04em}
  .sub{color:var(--faint);font-size:12.5px;line-height:1.7;margin-top:8px}
  h2{font-size:15px;margin:26px 0 10px;letter-spacing:.06em}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .row > label{font-size:12.5px;color:var(--ink2);width:100%;margin-bottom:2px}
  button, .chip{
    font:inherit;font-size:13.5px;padding:7px 13px;border:1px solid var(--line);
    background:#fff;color:var(--ink);border-radius:999px;cursor:pointer;line-height:1.2;
  }
  button.on, .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  button:hover,.chip:hover{border-color:var(--ink2)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .btn-main{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .btn-main:hover{filter:brightness(1.06)}
  .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:10px 0 0}
  .meta b{color:var(--accent)}
  .week{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:14px 0;overflow:hidden}
  .week-h{display:flex;justify-content:space-between;align-items:baseline;
          padding:10px 14px;background:#f1ede3;border-bottom:1px solid var(--line)}
  .week-h h3{margin:0;font-size:15px;letter-spacing:.05em}
  .week-h span{font-size:11.5px;color:var(--faint)}
  .ex{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 14px;border-bottom:1px dashed #e7e1d4}
  .ex:last-child{border-bottom:0}
  .ex .nm{font-size:14.5px}
  .ex .nm small{color:var(--faint);font-size:11.5px;margin-left:6px}
  .ex .sr{font-size:13px;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
  .ex .dt{grid-column:1 / -1;font-size:12.5px;color:var(--ink2);line-height:1.7;margin-top:2px}
  .ex .dt .tag{color:var(--faint);font-size:11.5px}
  .figs{grid-column:1 / -1;display:flex;gap:6px;margin-top:6px}
  .figs img{width:76px;height:76px;object-fit:contain;background:#2b2824;border-radius:8px;cursor:zoom-in}
  .figs img:only-child{width:96px;height:96px}
  .log{grid-column:1 / -1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
       font-size:12px;color:var(--faint);margin-top:6px}
  .log input{width:56px;font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);
             border-radius:6px;background:#fff;color:var(--ink)}
  .log button{font-size:12px;padding:3px 10px;border-radius:6px}
  .log .last{color:var(--accent2)}
  .warn{background:#fdf6e3;border:1px solid #e8d9a8;border-radius:8px;padding:10px 12px;
        font-size:12.5px;color:#6b5a22;line-height:1.75;margin:12px 0}
  .empty{color:var(--faint);font-size:13px;padding:16px}
  footer{margin-top:26px;color:var(--faint);font-size:11.5px;line-height:1.8;border-top:1px solid var(--line);padding-top:12px}
  footer a{color:var(--faint)}
  .note{font-size:12px;color:var(--faint);line-height:1.75;margin-top:8px}
  details summary{cursor:pointer;font-size:12px;color:var(--accent2);list-style:none}
  details summary::-webkit-details-marker{display:none}
  @media print{
    body{background:#fff}
    .panel,.actions,header .sub,footer .no-print{display:none}
    .week{break-inside:avoid;border-color:#999}
    .wrap{padding:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>健身助手</h1>
    <div class="sub">从 302 个真实动作里按你的器械与身体限制筛，再按 ACSM 2026 的容量规则排成一周。
      计划是规则算出来的，<b>不是 AI 现编的</b>；重量栏留给你自己填。</div>
  </header>

  <div class="panel" id="panel">
    <div class="row" data-field="goal">
      <label>目标</label>
      <button class="opt on" data-v="muscle">增肌</button>
      <button class="opt" data-v="strength">力量</button>
      <button class="opt" data-v="fatloss">减脂 / 体能</button>
      <button class="opt" data-v="grip">握力专项</button>
    </div>
    <div class="row" data-field="days">
      <label>每周练几次</label>
      <button class="opt" data-v="2">2 次</button>
      <button class="opt on" data-v="3">3 次</button>
      <button class="opt" data-v="4">4 次</button>
    </div>
    <div class="row" data-field="minutes">
      <label>每次时长</label>
      <button class="opt" data-v="30">30 分钟</button>
      <button class="opt on" data-v="45">45 分钟</button>
      <button class="opt" data-v="60">60 分钟</button>
    </div>
    <div class="row" data-field="equip">
      <label>器械</label>
      <button class="opt on" data-v="full">健身房（全器械）</button>
      <button class="opt" data-v="dumbbell">只有哑铃</button>
      <button class="opt" data-v="band">只有弹力带</button>
      <button class="opt" data-v="bar">只有单杠</button>
      <button class="opt" data-v="bodyweight">纯自重</button>
    </div>
    <div class="row" data-field="exp">
      <label>经验</label>
      <button class="opt on" data-v="novice">新手（半年内）</button>
      <button class="opt" data-v="some">有基础</button>
    </div>
    <div class="row" data-field="limits" data-multi="1">
      <label>身体限制（可多选；选了会移除对应该部位负荷较大的动作）</label>
      <button class="opt" data-v="waist">腰 / 下背</button>
      <button class="opt" data-v="knee">膝</button>
      <button class="opt" data-v="shoulder">肩</button>
      <button class="opt" data-v="wrist">腕</button>
      <button class="opt" data-v="elbow">肘</button>
    </div>
    <div class="row" data-field="focus" data-multi="1">
      <label>想加强（可选，会让该部位多一个动作）</label>
      <button class="opt" data-v="Chest">胸</button>
      <button class="opt" data-v="Lats">背阔</button>
      <button class="opt" data-v="Shoulders">肩</button>
      <button class="opt" data-v="Biceps">手臂</button>
      <button class="opt" data-v="Core">核心</button>
      <button class="opt" data-v="Glutes">臀</button>
      <button class="opt" data-v="Quads">腿</button>
    </div>
    <div class="row" data-field="age">
      <label>年龄</label>
      <button class="opt on" data-v="lt40">40 以下</button>
      <button class="opt" data-v="mid">40–55</button>
      <button class="opt" data-v="gt55">55 以上</button>
    </div>
    <div class="actions">
      <button class="btn-main" id="gen">生成计划</button>
      <button id="share">复制分享链接</button>
      <button id="print">打印 / 存 PDF</button>
      <button id="export">导出记录</button>
    </div>
    <div class="meta" id="meta"></div>
  </div>

  <div id="out"></div>

  <footer>
    容量与负荷依据：ACSM 2026 立场声明（Currier BS 等，<i>Med Sci Sports Exerc</i> 2026;58(4):851-872）。
    <br>动作数据：Workout Guide（Bryl Lim）· 动作要领原始英文来自 free-exercise-db（公共领域）。
    <br>本工具不提供医疗、康复或营养建议。动作过程中出现疼痛请立即停止，并咨询专业人士。
  </footer>
</div>

<script>
var RULES = {
  equipSets: {
    full:      ["Barbell","Dumbbell","Cable","Machine","Bodyweight","Resistance Band","Pull-up Bar","Kettlebell","Plate","Bench","Box","Chair","Wall","Towel","Doorway","Stability Ball","Cardio"],
    dumbbell:  ["Dumbbell","Bench","Bodyweight","Chair","Wall"],
    band:      ["Resistance Band","Bodyweight","Chair","Doorway","Wall"],
    bar:       ["Pull-up Bar","Bodyweight","Wall","Box"],
    bodyweight:["Bodyweight","Wall","Box","Chair","Doorway"]
  },

  splits: {
    "2": [
      { name: "全身 A", quota: [["Chest",1],["Lats",1],["Back",1],["Quads",1],["Hamstrings",1],["Core",1]] },
      { name: "全身 B", quota: [["Shoulders",1],["Glutes",1],["Upper Back",1],["Legs",1],["Core",1],["Calves",1]] }
    ],
    "3": [
      { name: "推", quota: [["Chest",2],["Shoulders",1],["Triceps",1],["Core",1]] },
      { name: "拉", quota: [["Lats",2],["Back",1],["Biceps",1],["Core",1]] },
      { name: "腿", quota: [["Quads",2],["Hamstrings",1],["Glutes",1],["Calves",1]] }
    ],
    "4": [
      { name: "上肢 A", quota: [["Chest",1],["Lats",1],["Shoulders",1],["Biceps",1],["Triceps",1]] },
      { name: "下肢 A", quota: [["Quads",1],["Hamstrings",1],["Glutes",1],["Calves",1],["Core",1]] },
      { name: "上肢 B", quota: [["Back",1],["Upper Back",1],["Chest",1],["Rear Delts",1],["Biceps",1]] },
      { name: "下肢 B", quota: [["Glutes",1],["Legs",1],["Hamstrings",1],["Core",1],["Calves",1]] }
    ]
  },

  // 组次：依据 ACSM 2026（容量按"每肌群每周组数"计，而非固定 8–12 次）
  schemes: {
    muscle:  { sets: 4,  reps: "8–15",  note: "每组留 1–2 次余力（不练到力竭）" },
    strength:{ sets: 4,  reps: "3–5",   note: "≥80% 1RM；复合动作优先，不追求力竭" },
    fatloss: { sets: 3,  reps: "12–15", note: "循环进行，组间少歇" },
    grip:    { sets: 3,  reps: "12–20", note: "握力类按次或按时长，走到接近握不住" }
  },

  noviceBlock: ["pistol","muscle-up","dragon","handstand","snatch","clean","jerk","nordic",
                "sissy","razor","ab-wheel","depth-jump","box-jump","overhead-squat","skin-the-cat"],

  isolationHints: ["curl","extension","raise","fly","pushdown","kickback","shrug","calf","wrist","lateral"],
  majorMuscles: ["Chest","Back","Lats","Shoulders","Quads","Hamstrings","Glutes","Core","Biceps","Triceps"]
};

function isIsolation(e) {
  var n = (e.slug + " " + e.en).toLowerCase();
  for (var i = 0; i < RULES.isolationHints.length; i++) {
    if (n.indexOf(RULES.isolationHints[i]) !== -1) return true;
  }
  return false;
}

function buildPool(opts) {
  var allow = RULES.equipSets[opts.equip] || RULES.equipSets.full;
  var limits = opts.limits || [];
  var pool = [];
  for (var i = 0; i < EXERCISES.length; i++) {
    var e = EXERCISES[i];
    if (allow.indexOf(e.equipment) === -1) continue;
    if (e.is_stretch) continue;
    if (opts.exp === "novice" && isNoviceBlocked(e)) continue;
    var t1 = RISK[e.slug] || [], t2 = RISK2[e.slug] || [];
    var hit = false, note = false;
    for (var j = 0; j < limits.length; j++) {
      if (t1.indexOf(limits[j]) !== -1) { hit = true; }
      else if (t2.indexOf(limits[j]) !== -1) { note = true; }
    }
    pool.push({ slug: e.slug, zh: e.zh, en: e.en, equipment: e.equipment, type: e.type,
                primary: e.primary, secondary: e.secondary, is_stretch: e.is_stretch,
                cue: e.cue, cue_verified: e.cue_verified, _hit: hit, _note: note });
  }
  return pool;
}

function isNoviceBlocked(e) {
  var s = (e.slug + " " + (e.en || "")).toLowerCase();
  for (var i = 0; i < RULES.noviceBlock.length; i++) {
    if (s.indexOf(RULES.noviceBlock[i]) !== -1) return true;
  }
  return false;
}

var PREFER_WEIGHTED = false;
// 这些器械做"负重训练"质量偏弱，有替代时排后
var LIGHT_EQUIP = ["Wall","Chair","Box","Towel","Doorway","Cardio","Stability Ball","Plate"];

function isLight(e) {
  return LIGHT_EQUIP.indexOf(e.equipment) !== -1;
}

function byCompound(a, b) {
  if (!!a._hit !== !!b._hit) return a._hit ? 1 : -1;   // 命中身体限制的排最后
  var ia = isIsolation(a) ? 1 : 0, ib = isIsolation(b) ? 1 : 0;
  if (ia !== ib) return ia - ib;
  if (PREFER_WEIGHTED) {
    var wa = (a.equipment === "Bodyweight" ? 2 : (isLight(a) ? 3 : 0));
    var wb = (b.equipment === "Bodyweight" ? 2 : (isLight(b) ? 3 : 0));
    if (wa !== wb) return wa - wb;
  }
  return (b.secondary || []).length - (a.secondary || []).length;
}

function pickForMuscle(pool, muscle, used) {
  var cands = [];
  for (var i = 0; i < pool.length; i++) {
    if (used[pool[i].slug]) continue;
    if (pool[i].primary === muscle) cands.push(pool[i]);
  }
  cands.sort(byCompound);
  return cands[0] || null;
}

// 兜底：配额肌群没货时，取任意未用过的复合动作，避免整天空白
var REGION = {
  Chest:"up", Lats:"up", Back:"up", "Upper Back":"up", Shoulders:"up", "Rear Delts":"up",
  Biceps:"up", Triceps:"up", Forearms:"up",
  Quads:"low", Hamstrings:"low", Glutes:"low", Calves:"low", Legs:"low",
  Adductors:"low", Hips:"low", "Posterior Chain":"low",
  Core:"core", "Lower Back":"core", Mobility:"core"
};

function pickFallback(pool, used, dayMuscles, wantRegion) {
  var cands = [], fresh = [];
  for (var i = 0; i < pool.length; i++) {
    if (used[pool[i].slug]) continue;
    if (wantRegion && REGION[pool[i].primary] !== wantRegion) continue;  // 只用同区域
    cands.push(pool[i]);
    if (!dayMuscles || !dayMuscles[pool[i].primary]) fresh.push(pool[i]);
  }
  // 优先"本日还没练到的肌群"，没有再退回任意动作
  var list = fresh.length ? fresh : cands;
  list.sort(byCompound);
  return list[0] || null;
}

function setsFor(goal, e) {
  var s = RULES.schemes[goal] || RULES.schemes.muscle;
  var sets = s.sets;
  if (goal === "strength" && isIsolation(e)) sets = 3;
  if (goal === "grip" && e.primary !== "Forearms") sets = 3;
  return { sets: sets, reps: s.reps, note: s.note };
}

function buildDay(dayDef, pool, opts, used, maxEx) {
  var focus = opts.focus || [];
  var quota = [], focusQ = [];
  for (var q = 0; q < dayDef.quota.length; q++) {
    var m = dayDef.quota[q][0], cnt = dayDef.quota[q][1];
    var isFocus = focus.indexOf(m) !== -1;
    if (isFocus) cnt += 1;
    (isFocus ? focusQ : quota).push([m, cnt]);
  }
  quota = focusQ.concat(quota);   // 加强部位先排
  var items = [], dayMuscles = {};
  for (var k = 0; k < quota.length && items.length < maxEx; k++) {
    for (var c = 0; c < quota[k][1] && items.length < maxEx; c++) {
      var e = pickForMuscle(pool, quota[k][0], used);
      if (!e) e = pickFallback(pool, used, dayMuscles, REGION[quota[k][0]] || "up");
      if (!e) break;
      used[e.slug] = true;
      dayMuscles[e.primary] = true;
      var ss = setsFor(opts.goal, e);
      items.push({ slug: e.slug, zh: e.zh || e.en, en: e.en, primary: e.primary,
                   equipment: e.equipment, sets: ss.sets, reps: ss.reps, note: ss.note,
                   cue: e.cue || "", verified: e.cue_verified !== false, isolation: isIsolation(e), frames: e.frames || [],
                   caution: !!e._hit, involve: !!e._note && !e._hit });
    }
  }
  items.sort(function (a, b) { return (a.isolation ? 1 : 0) - (b.isolation ? 1 : 0); });
  return { name: dayDef.name, items: items };
}

function addCardio(planDays, pool, maxEx) {
  var cardio = null;
  for (var i = 0; i < pool.length; i++) {
    if (pool[i].type === "duration" || pool[i].type === "distance_duration") { cardio = pool[i]; break; }
  }
  if (!cardio || !planDays.length) return;
  var last = planDays[planDays.length - 1];
  if (last.items.length >= maxEx) last.items.pop();
  last.items.push({ slug: cardio.slug, zh: cardio.zh || cardio.en, en: cardio.en,
                    primary: cardio.primary, equipment: cardio.equipment,
                    sets: 1, reps: "按时间", note: "有氧收尾", cue: cardio.cue || "",
                    verified: cardio.cue_verified !== false, isolation: false, frames: cardio.frames || [] });
}

function buildPlan(opts) {
  PREFER_WEIGHTED = (opts.equip !== "bodyweight");
  var pool = buildPool(opts);
  var split = RULES.splits[String(opts.days)] || RULES.splits["3"];
  var maxEx = opts.minutes >= 60 ? 6 : (opts.minutes >= 45 ? 5 : 4);

  // A 周
  var usedA = {};
  var daysA = [];
  for (var d = 0; d < split.length; d++) daysA.push(buildDay(split[d], pool, opts, usedA, maxEx));
  if (opts.goal === "fatloss") addCardio(daysA, pool, maxEx);

  // B 周（仅增肌目标需要：同一肌群一周练两次才够容量）
  var daysB = null;
  if (opts.goal === "muscle") {
    var usedB = {};
    daysB = [];
    for (var d2 = 0; d2 < split.length; d2++) daysB.push(buildDay(split[d2], pool, opts, usedB, maxEx));
  }

  // 周容量（A + B）
  var volume = {};
  function addVol(days) {
    if (!days) return;
    for (var i = 0; i < days.length; i++) {
      for (var j = 0; j < days[i].items.length; j++) {
        var it = days[i].items[j];
        volume[it.primary] = (volume[it.primary] || 0) + (typeof it.sets === "number" ? it.sets : 3);
      }
    }
  }
  addVol(daysA); addVol(daysB);

  var warn = [];
  var low = [];
  for (var mm in volume) {
    if (RULES.majorMuscles.indexOf(mm) !== -1 && volume[mm] < 8) low.push(mm + " " + volume[mm] + " 组");
  }
  if (opts.goal === "muscle" && low.length) {
    warn.push("这些肌群本周容量偏低（ACSM 2026 建议 ≥10 组/周）：" + low.join("、"));
  }
  if (opts.limits && opts.limits.length) {
    var risky = {};
    for (var i2 = 0; i2 < pool.length; i2++) {
      if (!pool[i2]._hit) risky[pool[i2].primary] = true;
    }
    var wiped = [];
    var seenMus = {};
    for (var d3 = 0; d3 < daysA.length; d3++) {
      for (var j3 = 0; j3 < daysA[d3].items.length; j3++) {
        var it3 = daysA[d3].items[j3];
        if (it3.caution && !risky[it3.primary] && !seenMus[it3.primary]) {
          seenMus[it3.primary] = true;
          wiped.push(it3.primary);
        }
      }
    }
    if (wiped.length) {
      warn.push("这些肌群在安全范围内已无动作，只能用标记 ⚠ 的动作： " + wiped.join("、") +
                "。做之前先确认不引起不适，或换更轻的同类动作。");
    }
  }
  if (pool.length < 12) warn.push("可用动作只剩 " + pool.length + " 个，建议放宽器械或身体限制。");

  return { days: daysA, daysB: daysB, poolSize: pool.length, volume: volume, warnings: warn,
           maxEx: maxEx, weeks: daysB ? 2 : 1 };
}

function encodeState(o) {
  var parts = ["g=" + o.goal, "d=" + o.days, "m=" + o.minutes, "e=" + o.equip, "x=" + o.exp];
  if ((o.limits || []).length) parts.push("l=" + o.limits.join("."));
  if ((o.focus || []).length) parts.push("f=" + o.focus.join("."));
  parts.push("a=" + (o.age || "lt40"));
  return parts.join("&");
}

function decodeState(hash) {
  var out = { goal: "muscle", days: 3, minutes: 45, equip: "full", exp: "novice",
              limits: [], focus: [], age: "lt40" };
  var s = (hash || "").replace(/^#/, "");
  if (!s) return out;
  var kv = s.split("&");
  for (var i = 0; i < kv.length; i++) {
    var p = kv[i].split("="), k = p[0], v = p.slice(1).join("=");
    if (k === "g") out.goal = v;
    else if (k === "d") out.days = parseInt(v, 10) || 3;
    else if (k === "m") out.minutes = parseInt(v, 10) || 45;
    else if (k === "e") out.equip = v;
    else if (k === "x") out.exp = v;
    else if (k === "a") out.age = v;
    else if (k === "l") out.limits = v ? v.split(".") : [];
    else if (k === "f") out.focus = v ? v.split(".") : [];
  }
  return out;
}

  });
  st.days = parseInt(st.days, 10) || 3;
  st.minutes = parseInt(st.minutes, 10) || 45;
  return st;
}

function writeUI(st) {
  ["goal","days","minutes","equip","exp","limits","focus","age"].forEach(function (f) {
    var row = document.querySelector('[data-field="' + f + '"]');
    if (!row) return;
    var multi = row.getAttribute("data-multi") === "1";
    var want = multi ? (st[f] || []) : [String(st[f])];
    $$(".opt", row).forEach(function (b) {
      var v = b.getAttribute("data-v");
      if (want.indexOf(v) !== -1) b.classList.add("on"); else b.classList.remove("on");
    });
  });
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c];
  });
}

var LOGKEY = "fitlog.v1";
function loadLog() {
  try { return JSON.parse(localStorage.getItem(LOGKEY) || "{}"); } catch (e) { return {}; }
}
function saveLog(o) { try { localStorage.setItem(LOGKEY, JSON.stringify(o)); } catch (e) {} }
function lastOf(slug) {
  var o = loadLog()[slug];
  return (o && o.length) ? o[o.length - 1] : null;
}
function figRow(it) {
  var f = it.frames || [];
  if (!f.length) return '';
  var s = '<div class="figs">';
  for (var i = 0; i < f.length; i++) {
    s += '<img loading="lazy" decoding="async" src="' + esc(f[i]) + '" alt="' + esc(it.zh) +
         ' 第' + (i + 1) + '帧" onclick="window.open(this.src,\'_blank\')" ' +
         'onerror="this.style.display=\'none\'">';
  }
  return s + '</div>';
}

function logRow(it) {
  var last = lastOf(it.slug);
  var w = last ? last.w : "", r = last ? last.r : "";
  return '<div class="log" data-log="' + esc(it.slug) + '">' +
    (last ? '<span class="last">上次 ' + esc(last.w) + 'kg × ' + esc(last.r) + '</span>' : '<span>还没记录</span>') +
    '<input class="lw" inputmode="decimal" placeholder="kg" value="' + esc(w) + '">' +
    '<input class="lr" inputmode="numeric" placeholder="次" value="' + esc(r) + '">' +
    '<button class="lsave">记一笔</button>' +
    '</div>';
}

function renderDay(day, tag) {
  var h = '<div class="week"><div class="week-h"><h3>' + esc(day.name) +
          (tag ? ' <span style="color:#8b8478;font-size:11.5px">' + esc(tag) + '</span>' : '') +
          '</h3><span>' + day.items.length + ' 个动作</span></div>';
  if (!day.items.length) return h + '<div class="empty">这一天空了（可用动作不足）</div></div>';
  for (var i = 0; i < day.items.length; i++) {
    var it = day.items[i];
    h += '<div class="ex"><div class="nm">' + (i + 1) + '. ' +
         (it.caution ? '<span style="color:#a63a2a;font-weight:700">⚠ </span>' : '') + esc(it.zh) +
         '<small>' + esc(it.en) + '</small></div>' +
         '<div class="sr">' + esc(it.sets) + ' × ' + esc(it.reps) + '</div>' +
         '<div class="dt"><span class="tag">' + esc(it.primary) + ' · ' + esc(it.equipment) + '</span>' +
         (it.involve ? ' <span class="tag" style="color:#a63a2a">（对选中部位有参与）</span>' : '') +
         (it.cue ? '<details><summary>怎么做 / 常见错</summary>' + esc(it.cue) +
           (it.verified ? '' : ' <span class="tag">（参考同类动作，未核对原版）</span>') + '</details>' : '') +
         '</div>' + figRow(it) + logRow(it) + '</div>';
  }
  return h + '</div>';
}

function render() {
  var plan = buildPlan(state);
  var out = "";
  if (plan.warnings.length) {
    out += '<div class="warn">' + plan.warnings.map(esc).join("<br>") + '</div>';
  }
  var head = document.createElement("div");
  head.className = "meta";
  head.innerHTML = "可用动作 <b>" + plan.poolSize + "</b> 个 · 每周 <b>" +
    plan.days.length + "</b> 次" + (plan.daysB ? "（A/B 两周交替，共 " + (plan.days.length * 2) + " 次）" : "") +
    " · 每次 <b>" + state.minutes + "</b> 分钟";
  $("#out").innerHTML = out;
  $("#out").appendChild(head);

  for (var d = 0; d < plan.days.length; d++) {
    $("#out").insertAdjacentHTML("beforeend", renderDay(plan.days[d], plan.daysB ? "第 1 周" : ""));
  }
  if (plan.daysB) {
    $("#out").insertAdjacentHTML("beforeend",
      '<div class="note" style="margin:18px 0 4px">下面这份是<b>第 2 周</b>：动作换一批，容量翻倍（同一肌群一周练到两次）。两周交替着练。</div>');
    for (var d2 = 0; d2 < plan.daysB.length; d2++) {
      $("#out").insertAdjacentHTML("beforeend", renderDay(plan.daysB[d2], "第 2 周"));
    }
  }
  var vol = [];
  for (var m in plan.volume) vol.push(m + " " + plan.volume[m] + " 组");
  $("#out").insertAdjacentHTML("beforeend",
    '<div class="note">本周每肌群组数（A' + (plan.daysB ? "+B" : "") + '）：' + esc(vol.join(" · ")) + '</div>');

  var LBL = {
    goal: { muscle: "增肌", strength: "力量", fatloss: "减脂 / 体能", grip: "握力专项" },
    equip: { full: "全器械", dumbbell: "只有哑铃", band: "只有弹力带", bar: "只有单杠", bodyweight: "纯自重" },
    lim: { waist: "腰", knee: "膝", shoulder: "肩", wrist: "腕", elbow: "肘" },
    mus: { Chest: "胸", Lats: "背阔", Shoulders: "肩", Biceps: "手臂", Core: "核心", Glutes: "臀", Quads: "腿" }
  };
  $("#meta").innerHTML = "目标 <b>" + esc(LBL.goal[state.goal] || state.goal) + "</b> · " +
    state.days + " 天/周 · " + esc(LBL.equip[state.equip] || state.equip) +
    (state.limits.length ? " · 限制 " + esc(state.limits.map(function (x) { return LBL.lim[x] || x; }).join("/")) : "") +
    (state.focus.length ? " · 加强 " + esc(state.focus.map(function (x) { return LBL.mus[x] || x; }).join("/")) : "");
}

function sync() {
  state = readUI();
  history.replaceState(null, "", "#" + encodeState(state));
  render();
}

document.addEventListener("click", function (e) {
  var sv = e.target.closest(".lsave");
  if (sv) {
    var box = sv.closest("[data-log]");
    var slug = box.getAttribute("data-log");
    var w = parseFloat($(".lw", box).value), r = parseFloat($(".lr", box).value);
    if (!isFinite(w) || !isFinite(r)) { sv.textContent = "填kg和次"; setTimeout(function () { sv.textContent = "记一笔"; }, 1500); return; }
    var all = loadLog();
    (all[slug] = all[slug] || []).push({ t: new Date().toISOString().slice(0, 10), w: w, r: r });
    if (all[slug].length > 30) all[slug] = all[slug].slice(-30);
    saveLog(all);
    sv.textContent = "已记 ✓";
    setTimeout(function () { sv.textContent = "记一笔"; }, 1200);
    var last = $(".last", box);
    var txt = "上次 " + w + "kg × " + r;
    if (last) last.textContent = txt;
    else box.insertAdjacentHTML("afterbegin", '<span class="last">' + esc(txt) + '</span>');
    return;
  }
  var b = e.target.closest(".opt");
  if (!b) return;
  var row = b.closest('[data-field]');
  if (!row) return;
  var multi = row.getAttribute("data-multi") === "1";
  if (multi) b.classList.toggle("on");
  else $$(".opt", row).forEach(function (x) { x.classList.remove("on"); }), b.classList.add("on");
  sync();
});

$("#gen").addEventListener("click", sync);
$("#print").addEventListener("click", function () { window.print(); });
$("#export").addEventListener("click", function () {
  var data = loadLog();
  var lines = ["动作\t日期\t重量kg\t次数"];
  for (var s in data) for (var i = 0; i < data[s].length; i++) {
    var r = data[s][i];
    lines.push(s + "\t" + r.t + "\t" + r.w + "\t" + r.r);
  }
  var blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "训练记录_" + new Date().toISOString().slice(0, 10) + ".txt";
  a.click();
});
$("#share").addEventListener("click", function () {
  var url = location.origin + location.pathname + "#" + encodeState(state);
  var done = function () { $("#share").textContent = "已复制 ✓"; setTimeout(function () { $("#share").textContent = "复制分享链接"; }, 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, function () { prompt("复制这个链接：", url); });
  } else { prompt("复制这个链接：", url); }
});

(function init() {
  if (location.hash.length > 1) state = decodeState(location.hash);
  state.limits = state.limits || [];
  state.focus = state.focus || [];
  writeUI(state);
  render();
})();
</script>
</body>
</html>
